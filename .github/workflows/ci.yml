name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # Packages depend on each other via file: links, so install+build them in
      # dependency order before running any tests.
      - name: Build & test packages in dependency order
        run: |
          set -e
          for pkg in agent-policy agent-tools agent-mcp agent-plugins agent-memory; do
            echo "::group::$pkg"
            cd "$pkg"
            npm install --no-audit --no-fund
            npm run build
            npm test
            cd ..
            echo "::endgroup::"
          done

      # The server is where most of the behaviour lives (chat-handler, the gates, the
      # intent router, deep_explore) — and its ~950 tests were NOT running here at all.
      # They were left out because `node --test` never EXITED: importing chat-handler
      # starts the autonomous loop, skill watchers and follow-up timers at module load,
      # so the runner sat on open handles forever. The tests themselves were green the
      # whole time. `--test-force-exit` (in the server's own `npm test`) makes the run
      # terminate, so the suite that guards the most-changed code finally gates merges.
      # It runs LAST so a library break is still reported first.
      - name: Test server
        run: |
          set -e
          cd server
          npm install --no-audit --no-fund
          npm test

  smoke:
    # Cross-platform build + boot smoke test. macos-latest is Apple Silicon
    # (arm64) — this is how we verify macOS without owning a Mac: it exercises
    # the native-module prebuilds (better-sqlite3 darwin-arm64) and the per-OS
    # shell-exec branches. Mock mode (no API key) — verifies build + boot, not
    # an LLM round-trip.
    name: Build & boot smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Build libraries (dependency order) + install server deps
        run: |
          set -e
          for pkg in agent-policy agent-tools agent-mcp agent-plugins agent-memory; do
            echo "::group::$pkg"
            (cd "$pkg" && npm install --no-audit --no-fund && npm run build)
            echo "::endgroup::"
          done
          (cd server && npm install --no-audit --no-fund)

      - name: Boot server and probe the memory API (mock mode)
        run: |
          set -e
          (cd server && npm run dev > "$RUNNER_TEMP/philont-server.log" 2>&1 &)
          up=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:20266/ || echo 000)
            if [ "$code" = "200" ]; then echo "server up (HTTP $code) after ${i}s"; up=1; break; fi
            sleep 1
          done
          stats=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:20266/api/memory/stats || echo 000)
          echo "memory API: HTTP $stats"
          echo "::group::server.log"; cat "$RUNNER_TEMP/philont-server.log" || true; echo "::endgroup::"
          pkill -f "tsx src/index.ts" || true
          test "$up" = "1" && test "$stats" = "200"

  macos-user-path:
    # A separate, pinned Apple Silicon job exercises the path a user actually
    # takes: full repository build, launcher, bundled UI in a real browser,
    # mock chat, tab navigation, supervised restart, and SQLite persistence.
    name: macOS clean install & browser workflow
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build through the documented user path
        env:
          PHILONT_PYENV_DIR: ${{ runner.temp }}/philont-pyenv
        run: ./scripts/build-all.sh

      - name: Exercise launcher, browser UI, chat, navigation, and restart
        env:
          PHILONT_HOME: ${{ runner.temp }}/philont-home
          PHILONT_NO_OPEN: "1"
          PHILONT_LAUNCHER_QUIET: "1"
          PHILONT_E2E_BASE_URL: http://127.0.0.1:20267
          PHILONT_E2E_AGENT_URL: http://127.0.0.1:21266
        run: |
          set -euo pipefail
          launcher_log="$RUNNER_TEMP/philont-launcher.log"
          ./scripts/start.sh > "$launcher_log" 2>&1 &
          launcher_pid=$!
          cleanup() {
            kill -TERM "$launcher_pid" 2>/dev/null || true
            wait "$launcher_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:20267/api/launcher/status >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat "$launcher_log"
            exit 1
          fi

          (cd web-ui && npm run test:e2e)

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-platform-smoke-diagnostics
          path: |
            ${{ runner.temp }}/philont-launcher.log
            web-ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: Type-check server & web-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build libraries, then type-check apps
        run: |
          set -e
          for pkg in agent-policy agent-tools agent-mcp agent-plugins agent-memory; do
            (cd "$pkg" && npm install --no-audit --no-fund && npm run build)
          done
          for app in server web-ui; do
            echo "::group::$app"
            (cd "$app" && npm install --no-audit --no-fund && npx tsc --noEmit)
            echo "::endgroup::"
          done
